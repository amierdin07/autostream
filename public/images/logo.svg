<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="simaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Badge -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="#1E1E2E" stroke="url(#simaGrad)" stroke-width="4"/>
  <!-- Stylized Letter S with Stream Play Waves -->
  <path d="M66 32 C62 25, 48 24, 39 28 C28 33, 27 46, 38 50 L56 56 C68 60, 68 73, 58 78 C47 83, 33 80, 28 72" 
        fill="none" 
        stroke="url(#simaGrad)" 
        stroke-width="9" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <!-- Streaming Play Triangle Accent -->
  <polygon points="70,47 70,57 79,52" fill="#EC4899" filter="url(#glow)"/>
</svg>
